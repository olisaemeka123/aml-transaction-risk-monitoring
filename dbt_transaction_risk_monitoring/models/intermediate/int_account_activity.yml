models:
  - name: int_account_activity
    description: >
      Unions the sender and receiver perspectives of every transaction into
      one row per role view, so an account's risk profile reflects its full
      activity regardless of which side of a transaction it was on. This prevents duplicating aggregation logic per role
      in every downstream rule.
    columns:
      - name: account_id
        description: The account, regardless of whether it was the sender or receiver.
        tests:
          - not_null

      - name: transaction_id
        description: The underlying transaction. Appears twice across the model (once per role).
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - transaction_id
                  - account_role

          - not_null
          
      - name: transaction_ts
        description: When the transaction occurred.
        tests:
          - not_null

      - name: amount
        description: Transaction amount.

      - name: account_role
        description: Whether this account was the sender or receiver on this transaction.
        tests:
          - accepted_values:
              arguments:
                values: ['sender', 'receiver']