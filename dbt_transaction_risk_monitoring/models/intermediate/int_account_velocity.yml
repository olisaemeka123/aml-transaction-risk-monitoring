models:
  - name: int_account_velocity
    description: >
      Rolling transaction counts per account across three windows (1h/24h/7d),
      computed via a window function over int_account_activity. 
    columns:
      - name: account_id
        tests:
          - not_null
      - name: transaction_id
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - transaction_id
                  - account_role
          - not_null

      - name: txn_count_last_1h
        description: Count of this account's activity (sender + receiver) in the preceding 1 hour, inclusive of this row.

      - name: txn_count_last_24h
        description: Same, over a 24 hour window.

      - name: txn_count_last_7d
        description: Same, over a 7 day window.
