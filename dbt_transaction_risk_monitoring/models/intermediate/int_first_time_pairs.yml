models:  
  - name: int_first_time_pairs
    description: >
      One row per transaction, flagging whether it is the first time the
      sender has paid this receiver. Ties on timestamp are
      broken by transaction_id so exactly one transaction per pair is
      flagged.The synthetic generator picks counterparties at
      random, so ~99.99% of transactions (fraud and non-fraud alike) are
      flagged as first-time pairs. The flag has no standalone discriminating
      power on this data and is intended as a supporting signal only. 
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: transaction_ts
        tests:
          - not_null
      - name: sender_account_id
        tests:
          - not_null
      - name: receiver_account_id
        tests:
          - not_null
      - name: pair_txn_sequence
        tests:
          - not_null
      - name: is_first_time_pair
        tests:
          - not_null