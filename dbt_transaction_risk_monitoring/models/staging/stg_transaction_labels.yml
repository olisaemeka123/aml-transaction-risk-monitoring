models:
  - name: stg_transaction_labels
    description: >
      Staging model for the transaction labels source. Only used in the
      validation model that checks detection performance against ground truth.
    columns:
      - name: transaction_id
        description: Unique identifier for the transaction.
        tests:
          - unique
          - not_null

      - name: is_fraud_ground_truth
        description: >
          Ground truth label indicating if the transaction is fraudulent.
          Only used for evaluation purposes.
        tests:
          - not_null

      - name: fraud_pattern
        description: >
          The pattern associated with the fraud. Used as a debugging field.

      - name: label_sequence
        description: >
          Monotonically increasing position. Used as a cursor for
          incremental extraction.
        tests:
          - not_null